name: CI

# Every push. This is the safety net that makes pushing straight to main safe:
# a bad commit fails here, and whatever is deployed keeps serving the last good
# version. Without it, "deploy only on green" is a claim rather than a
# mechanism.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Content config is valid JSON and structurally sound
        # Checks the committed vocabulary. The Catalog and role manifest are
        # gitignored since ADR-0001, so a clean checkout has neither and this
        # skips them; the site validates each snapshot it accepts.
        run: node scripts/check-content.mjs
