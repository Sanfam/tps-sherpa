# Litestream 0.5.17 (pinned in the root Dockerfile). Read by apps/bot/start.sh.
#
# Replicates the bot's durable store, and only that: tier0.db and the JSON
# caches beside it on the volume are never replicated (ADR-0001). The replica
# is configured entirely from the environment; start.sh refuses to run without
# these variables. $BOT_DB_PATH is set by start.sh, so Litestream and the app
# always agree on the file.

dbs:
  - path: ${BOT_DB_PATH}
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: bot.db
      # R2: https://<account_id>.r2.cloudflarestorage.com. Litestream detects
      # the R2 host and applies its R2 defaults; the https scheme is required
      # for that.
      endpoint: ${LITESTREAM_ENDPOINT}
      region: auto
      # Keys come from LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY,
      # which Litestream reads itself.

# Erasure policy (ADR-0001): a removed row must leave backups within 30 days.
# The bucket's 28-day lifecycle rule is the bound that holds (docs/runbook.md):
# R2 can answer a delete with success without deleting, so what Litestream
# deletes is not proof. R2 expires objects typically within a day of the rule,
# best effort, so 28 days leaves about two days of headroom, not a guarantee.
# The bot's hourly heartbeat keeps the store changing, so Litestream keeps
# snapshotting daily and the rule never deletes the newest snapshot. This retention is best effort on top, until it has been
# checked against the bucket. In 0.5.x it deletes snapshots older than this,
# and the lower-level files only they needed, on each snapshot interval,
# always keeping the newest snapshot: about nine days while the bot runs.
snapshot:
  interval: 24h
  retention: 168h

# Logs to stderr, so start.sh can read `litestream ltx` output as the table
# alone whatever LOG_LEVEL is set to.
logging:
  stderr: true
